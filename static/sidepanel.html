<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Application Robot</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #18181b; --muted: #52525b; --line: #e4e4e7; --card: #fafafa;
      --accent: #1d4ed8; --accent-fg: #ffffff;
      --done: #15803d; --review: #b45309; --missing: #b91c1c;
      --banner-bg: #fef3c7; --banner-fg: #78350f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #3f3f46; --card: #27272a;
        --accent: #60a5fa; --accent-fg: #0b1220;
        --done: #4ade80; --review: #fbbf24; --missing: #f87171;
        --banner-bg: #422006; --banner-fg: #fde68a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 14px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
    h1 { font-size: 16px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; min-height: 20px; }
    button { font: inherit; min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
    button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: progress; }
    .primary { width: 100%; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { flex: 1; font-size: 13px; }
    .banner { background: var(--banner-bg); color: var(--banner-fg); border-radius: 8px; padding: 8px 10px; margin: 10px 0 0; font-size: 13px; }
    .banner[hidden] { display: none; }
    .group { margin-top: 14px; }
    .group h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 0 0 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .count { margin-left: auto; color: var(--muted); font-weight: 400; }
    .done .dot { background: var(--done); } .review .dot { background: var(--review); } .missing .dot { background: var(--missing); }
    .item { display: block; width: 100%; text-align: left; min-height: 0; padding: 8px 10px; margin: 0 0 6px; border-left: 3px solid var(--line); }
    .done .item { border-left-color: var(--done); } .review .item { border-left-color: var(--review); } .missing .item { border-left-color: var(--missing); }
    .label { font-weight: 600; font-size: 13px; }
    .req { color: var(--missing); }
    .value, .note { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .value { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .note { font-style: italic; }
    details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
    summary { cursor: pointer; font-weight: 600; min-height: 32px; }
    label.f { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
    label.f input, label.f textarea { display: block; width: 100%; margin-top: 4px; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; }
    textarea { min-height: 110px; resize: vertical; }
    .saved { font-size: 12px; color: var(--muted); }
    label.check { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); min-height: 32px; cursor: pointer; }
    label.check input { width: 18px; height: 18px; accent-color: var(--accent); }
    @media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s, border-color .15s; } }
  </style>
</head>
<body>
  <h1>Job Application Robot</h1>
  <p class="sub" id="status" role="status" aria-live="polite">Open an application form, then press Fill.</p>
  <button class="primary" id="fill">Fill this application</button>
  <label class="check"><input type="checkbox" id="autoAdvance" checked> Keep going: press Next on each page (never Submit)</label>
  <div class="row">
    <button id="letter">Download cover letter</button>
    <button id="notion">Mark applied</button>
  </div>
  <p class="banner" id="banner" hidden></p>

  <section id="report" aria-label="Fill results"></section>

  <details>
    <summary>Settings</summary>
    <label class="f">Claude API key
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-… (saved, not shown)">
    </label>
    <div class="row"><button id="saveKey">Save key</button><button id="testKey">Test connection</button></div>

    <label class="f">Profile (Markdown: every fact Claude may use)
      <textarea id="profile"></textarea>
    </label>
    <label class="f">Example cover letters (optional, plain text)
      <textarea id="letterExamples"></textarea>
    </label>
    <label class="f">CV (PDF) <span class="saved" id="cvName"></span>
      <input id="cv" type="file" accept="application/pdf,.doc,.docx">
    </label>
    <label class="f">Transcript (PDF) <span class="saved" id="transcriptName"></span>
      <input id="transcript" type="file" accept="application/pdf">
    </label>
    <label class="f">Notion integration token (optional)
      <input id="notionToken" type="password" autocomplete="off" placeholder="saved, not shown">
    </label>
    <label class="f">Notion database ID
      <input id="notionDatabaseId" type="text">
    </label>
    <div class="row"><button id="saveSettings">Save settings</button></div>
  </details>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
